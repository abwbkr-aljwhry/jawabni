<style>
  :root { --gold1: #ffe27a; --gold2: #ffb300; --glass: rgba(255,255,255,.12); --line: rgba(255,255,255,.22); }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    font-family: 'Segoe UI', Tahoma, 'Noto Sans Arabic', Arial, sans-serif; color: #fff;
    background: linear-gradient(160deg, #1b1147 0%, #35157a 50%, #7b1fa2 100%); background-attachment: fixed;
    overflow-x: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none;

  input { user-select: text; -webkit-user-select: text; font-family: inherit; }
  #bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }

  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .35; }

  .btn { border: none; border-radius: 16px; padding: 14px 18px; font-size: 17px; font-weight: bold; cursor: pointer; font-family: inherit; color: #fff; width: 100%; transition: transform .1s, filter .2s; }

  .btn.gold:active { box-shadow: 0 2px 0 #b27800; transform: translateY(4px); }
  .btn.glass { background: var(--glass); border: 1.5px solid var(--line); backdrop-filter: blur(6px); }
  .btn.green { background: linear-gradient(180deg, #54e08b, #1fa85b); box-shadow: 0 5px 0 #14733d, 0 8px 18px #0005; }
  .btn.green:active { box-shadow: 0 1px 0 #14733d; transform: translateY(4px); }
  .btn.help { background: var(--glass); border: 1.5px solid var(--line); font-size: 14px; padding: 10px 6px; border-radius: 14px; }
  .btn:disabled, .btn.off { opacity: .4; cursor: not-allowed; filter: grayscale(.6); }
  .big { font-size: 20px; padding: 17px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }

  /* ---- القائمة ---- */
  .menu { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding-top: 10px; position: relative; }
  .logo { text-align: center; margin-bottom: 6px; position: relative; }

  .logo h1 { font-size: 58px; font-weight: 900; background: linear-gradient(180deg, #fff, var(--gold1) 70%, var(--gold2)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 10px #0008); line-height: 1.3; }
  .tag { font-size: 18px; opacity: .9; }
  .tag2 { font-size: 13px; opacity: .65; margin-top: 4px; }
  .fq { position: absolute; font-size: 28px; opacity: .25; animation: float 6s ease-in-out infinite; pointer-events: none; }
  @keyframes float { 50% { transform: translateY(-22px) rotate(12deg); } }
  .savebox { text-align: center; background: var(--glass); border: 1.5px solid var(--line); border-radius: 16px; padding: 10px; font-size: 14px; }
  .dev { text-align: center; font-size: 13px; opacity: .85; line-height: 1.9; margin-top: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
  .dev b { color: var(--gold1); font-size: 15px; }

  /* ---- شاشة اللعب ---- */

  .iconbtn { width: 44px; height: 44px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--glass); color: #fff; font-size: 20px; cursor: pointer; }

  .coins { display: flex; align-items: center; gap: 6px; background: linear-gradient(180deg, #4a2c00, #2e1a00); border: 2px solid var(--gold2); border-radius: 22px; padding: 7px 14px; font-size: 18px; font-weight: bold; color: var(--gold1); min-width: 88px; justify-content: center; }

  .prog { height: 12px; background: #0004; border-radius: 8px; margin: 14px 0 6px; overflow: hidden; border: 1px solid var(--line); }
  .prog i { display: block; height: 100%; border-radius: 8px; background: linear-gradient(90deg, #ffe27a, #ff8f00); transition: width .5s; }
  .stage { text-align: center; font-size: 13px; opacity: .85; margin-bottom: 10px; }
  .qcard { background: var(--glass); border: 1.5px solid var(--line); border-radius: 24px; padding: 20px 16px; text-align: center; backdrop-filter: blur(8px); box-shadow: 0 10px 30px #0004; animation: slidein .4s; }

  .word { display: flex; gap: 5px; }
  .lb { width: 36px; height: 44px; border-radius: 11px; background: #ffffff1c; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; }

  .hintbox { margin-top: 14px; background: #ffe27a22; border: 1.5px dashed var(--gold1); border-radius: 14px; padding: 10px 12px; font-size: 15px; line-height: 1.7; color: var(--gold1); animation: slidein .4s; }
  .answer { margin-top: 16px; display: flex; gap: 8px; }
  .answer input { flex: 1; min-width: 0; border: 2px solid var(--line); background: #0003; color: #fff; font-size: 20px; padding: 13px 14px; border-radius: 16px; outline: none; text-align: center; }
  .answer input:focus { border-color: var(--gold1); }
  .answer input::placeholder { color: #fff8; font-size: 16px; }
  .answer .btn { width: 82px; padding: 0; font-size: 22px; }
  .shake { animation: shake .45s; }

  .msg { min-height: 24px; text-align: center; margin-top: 8px; font-weight: bold; color: #ff8a80; font-size: 15px; }
  .helpers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
  .helpers small { display: block; font-size: 12px; color: var(--gold1); margin-top: 2px; }
  .banner { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: linear-gradient(180deg, var(--gold1), var(--gold2)); color: #4a2c00; font-weight: bold; padding: 12px 22px; border-radius: 30px; z-index: 30; box-shadow: 0 8px 24px #0008; animation: drop 3.2s forwards; white-space: nowrap; }
  @keyframes drop { 0% { top: -80px; } 12%, 80% { top: 14px; } 100% { top: -80px; } }

  /* ---- النوافذ ---- */
  .overlay { position: fixed; inset: 0; background: #000b; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; animation: fade .25s; overflow: hidden; }
  @keyframes fade { from { opacity: 0; } }
  .modal { background: linear-gradient(160deg, #3a1a85, #5a1a8f); border: 2px solid var(--gold1); border-radius: 26px; padding: 24px 20px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 20px 60px #000a; animation: zoom .35s; position: relative; max-height: 92vh; overflow: auto; }

  .modal h2 { font-size: 26px; margin: 8px 0; color: var(--gold1); }
  .modal p { font-size: 16px; line-height: 1.8; margin-bottom: 6px; }
  .modal .ans { display: inline-block; background: #ffffff1f; border-radius: 14px; padding: 8px 20px; font-size: 24px; font-weight: bold; margin: 8px 0 12px; }
  .reward { font-size: 30px; font-weight: bold; color: var(--gold1); margin: 6px 0 14px; animation: pop .8s; }
  .howto { text-align: right; font-size: 15px; line-height: 1.8; }
  .howto li { margin: 0 18px 6px 0; }
  .conf { position: absolute; top: -30px; font-size: 24px; animation: fall linear forwards; pointer-events: none; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
</style>

  { c: 'foot',   q: 'من هو النجم البرتغالي الذي سجّل أكثر من 900 هدف في مسيرته؟', a: 'رونالدو', alt: ['كريستيانو رونالدو', 'كريستيانو'], h: 'لقبه CR7.' },
  { c: 'gen',    q: 'ما اسم العنصر الكيميائي الذي رمزه Au؟', a: 'الذهب', alt: ['ذهب'], h: 'معدن أصفر ثمين.' },
  { c: 'geo',    q: 'ما هي عاصمة كندا؟', a: 'أوتاوا', alt: ['اتاوا', 'أتاوا'], h: 'ليست تورنتو ولا مونتريال.' },
  { c: 'prov',   q: 'أكمل المثل: رُبَّ أخٍ لك لم تلده ...', a: 'أمك', alt: [], h: 'هي من أنجبتك.' },
  { c: 'riddle', q: 'ما هو الشيء الذي يمكنك كسره دون أن تلمسه؟', a: 'الوعد', alt: ['وعد', 'الصمت', 'صمت', 'السكوت'], h: 'إذا أعطيته لأحد ثم لم تفِ به.' },
  { c: 'gen',    q: 'ما اسم أقرب كواكب المجموعة الشمسية إلى الشمس؟', a: 'عطارد', alt: ['كوكب عطارد'], h: 'هو أصغر كواكب المجموعة الشمسية.' },
  { c: 'geo',    q: 'ما اسم المضيق الذي يفصل بين المغرب وإسبانيا؟', a: 'جبل طارق', alt: ['مضيق جبل طارق'], h: 'سُمّي على اسم القائد طارق بن زياد.' },
  { c: 'gen',    q: 'من هو العالم المسلم الملقّب بـ «أبو الجبر»؟', a: 'الخوارزمي', alt: ['خوارزمي', 'محمد بن موسى الخوارزمي'], h: 'كلمة Algorithm الإنجليزية مشتقة من اسمه.' }
];
const TOTAL = QUESTIONS.length;

// ============ 3) الحفظ التلقائي ============
function newState(sound) {
  return {
    coins: START_COINS,
    queue: QUESTIONS.map((_, i) => i),   // الأسئلة المتبقية بالترتيب
    revealed: {},                        // الحروف المكشوفة لكل سؤال
    hints: {},                           // التلميحات المستخدمة
    stats: { correct: 0, letters: 0, hints: 0 },
    stageSeen: 0,
    started: false,
    sound: sound !== false
  };
}
let S;
try {
  const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
  S = saved ? Object.assign(newState(), saved) : newState();
  S.stats = Object.assign({ correct: 0, letters: 0, hints: 0 }, S.stats || {});
} catch (e) { S = newState(); }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

// ============ 4) أدوات مساعدة ============
let screen = 'menu';     // menu | game | end
let result = null;       // نتيجة الجولة الأخيرة
let draft = '';          // ما كتبه اللاعب
let showHowto = false;
let ac;

const solved = () => TOTAL - S.queue.length;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
const stageIdx = () => Math.min(STAGES.length - 1, Math.floor(solved() / 10));

function norm(s) {
  return String(s)
    .replace(/[ً-ٰٟـ]/g, '')
    .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
    .replace(/[٠-٩]/g, d => String(d.charCodeAt(0) - 1632))
    .replace(/[^ء-يa-zA-Z0-9]/g, '')
    .toLowerCase();
}
const strip = s => (s.length > 3 && s.startsWith('ال')) ? s.slice(2) : s;
function isCorrect(q, txt) {
  const n = norm(txt);
  if (!n) return false;
  return [q.a].concat(q.alt).some(a => { const m = norm(a); return n === m || strip(n) === strip(m); });
}
const letterCount = q => [...q.a.replace(/ /g, '')].length;

function beep(freqs, dur, type) {
  if (!S.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime; dur = dur || 0.12;
    freqs.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + i * dur);
      g.gain.exponentialRampToValueAtTime(0.18, t + i * dur + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (i + 1) * dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t + i * dur); o.stop(t + (i + 1) * dur + 0.03);
    });
  } catch (e) {}
}
const sndOk = () => beep([523, 659, 784, 1047], 0.11);
const sndBad = () => beep([200, 150], 0.16, 'sawtooth');
const sndTap = () => beep([660], 0.05);
const sndBuy = () => beep([880, 1175], 0.08);

function confetti() {
  const em = ['🎉', '✨', '⭐', '🪙', '🎊'];
  return Array.from({ length: 26 }, () =>
    `<span class="conf" style="left:${Math.random() * 100}%;animation-duration:${2 + Math.random() * 2.5}s;animation-delay:${Math.random() * 0.8}s;font-size:${18 + Math.random() * 16}px">${em[Math.floor(Math.random() * em.length)]}</span>`
  ).join('');
}

// ============ 5) الرسم على الشاشة ============
function renderMenu() {
  const s = solved();
  const label = !S.started ? '▶ ابدأ اللعب' : (S.queue.length === 0 ? '🏆 عرض النتيجة' : `▶ متابعة اللعب · الجولة ${s + 1}`);
  const saveInfo = S.started
    ? `<div class="savebox">تقدمك محفوظ تلقائيًا ✅<br>أجبت على <b>${s}</b> من ${TOTAL} · رصيدك 🪙 <b>${S.coins}</b></div>` : '';
  const fq = ['12%|8%', '82%|14%', '8%|58%', '88%|52%', '20%|86%', '76%|90%'].map((p, i) => {
    const [l, t] = p.split('|');
    return `<span class="fq" style="left:${l};top:${t};animation-delay:${i * 0.7}s">${i % 2 ? '❓' : '❔'}</span>`;
  }).join('');
  return `
  <div class="menu">${fq}
    <div class="logo">
      <div class="logo-q">؟</div>
      <h1>جاوبني؟</h1>
      <p class="tag">لعبة المعلومات والألغاز</p>
      <p class="tag2">${TOTAL} جولة · تزداد صعوبة شيئًا فشيئًا</p>
    </div>
    ${saveInfo}
    <div class="stack">
      <button class="btn gold big" data-a="play">${label}</button>
      <button class="btn glass" data-a="howto">📖 طريقة اللعب</button>
      <button class="btn glass" data-a="sound">${S.sound ? '🔊 الصوت: مفعّل' : '🔇 الصوت: متوقف'}</button>
      <button class="btn glass" data-a="newgame">🔄 لعبة جديدة</button>
    </div>
    <div class="dev">تطوير: <b>أبوبكر الجوهري</b><br>© جميع الحقوق محفوظة — الجوهري</div>
  </div>`;
}

function boxes(q, rev) {
  let idx = 0;
  return q.a.split(' ').map(w =>
    `<div class="word">${[...w].map(ch => { const i = idx++; const on = rev.includes(i); return `<div class="lb ${on ? 'on' : ''}">${on ? ch : ''}</div>`; }).join('')}</div>`
  ).join('');
}

function renderGame() {
  const qi = S.queue[0], q = QUESTIONS[qi], cat = CATS[q.c];
  const rev = S.revealed[qi] || [];
  const st = STAGES[stageIdx()];
  const canLetter = S.coins >= COST_LETTER && rev.length < letterCount(q) - 1;
  const canHint = S.coins >= COST_HINT && !S.hints[qi];
  const canSkip = S.queue.length > 1;
  let banner = '';
  if (stageIdx() > S.stageSeen) {
    banner = `<div class="banner">${st.i} مرحلة جديدة: ${st.n}</div>`;
    S.stageSeen = stageIdx(); save();
  }
  return `${banner}
  <div class="bar">
    <button class="iconbtn" data-a="menu" aria-label="القائمة">☰</button>
    <div class="round">الجولة ${solved() + 1} / ${TOTAL}<small>${st.i} مستوى ${st.n}</small></div>
    <div class="coins" id="coins">🪙 <span>${S.coins}</span></div>
  </div>
  <div class="prog"><i style="width:${(solved() / TOTAL) * 100}%"></i></div>
  <div class="stage">أجبت على ${solved()} من ${TOTAL}</div>
  <div class="qcard">
    <span class="chip c-${q.c}">${cat.i} ${cat.n}</span>
    <div class="qtext">${q.q}</div>
    <div class="letters">${boxes(q, rev)}</div>
    ${S.hints[qi] ? `<div class="hintbox">💡 ${q.h}</div>` : ''}
    <div class="answer" id="ansrow">
      <input id="ans" type="text" value="${esc(draft)}" placeholder="اكتب إجابتك هنا" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
      <button class="btn green" data-a="check" aria-label="تحقق">✓</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>
  <div class="helpers">
    <button class="btn help ${canLetter ? '' : 'off'}" data-a="letter">🔤 حرف<small>🪙 ${COST_LETTER}</small></button>
    <button class="btn help ${canHint ? '' : 'off'}" data-a="hint">💡 تلميح<small>🪙 ${COST_HINT}</small></button>
    <button class="btn help ${canSkip ? '' : 'off'}" data-a="skip">⏭ تخطي<small>مجانًا</small></button>
  </div>`;
}

function renderEnd() {
  return `
  <div class="menu" style="text-align:center">
    <div class="logo">
      <div class="logo-q" style="font-size:64px">🏆</div>
      <h1 style="font-size:40px">أحسنت! أنهيت اللعبة</h1>
      <p class="tag">أجبت على جميع الجولات الـ ${TOTAL}</p>
    </div>
    <div class="savebox">رصيدك النهائي 🪙 <b>${S.coins}</b><br>أحرف كُشفت: ${S.stats.letters} · تلميحات: ${S.stats.hints}</div>
    <div class="stack">
      <button class="btn gold big" data-a="restart">🔄 العب من جديد</button>
      <button class="btn glass" data-a="menu">☰ القائمة الرئيسية</button>
    </div>
    <div class="dev">تطوير: <b>أبوبكر الجوهري</b><br>© جميع الحقوق محفوظة — الجوهري</div>
  </div>`;
}

function renderLayer() {
  if (showHowto) {
    return `<div class="overlay"><div class="modal">
      <span class="emoji">📖</span><h2>طريقة اللعب</h2>
      <ul class="howto">
        <li>اقرأ السؤال واكتب إجابتك ثم اضغط ✓</li>
        <li>كل إجابة صحيحة تمنحك <b>${REWARD} 🪙</b></li>
        <li>🔤 <b>كشف حرف</b> يكلّف ${COST_LETTER} 🪙</li>
        <li>💡 <b>التلميح</b> يكلّفك ${COST_HINT} 🪙</li>
        <li>⏭ <b>التخطي</b> مجاني، ويعود السؤال في آخر اللعبة</li>
        <li>الجولات ${TOTAL}، وتزداد صعوبتها تدريجيًا</li>
        <li>💾 تقدمك يُحفظ تلقائيًا، واللعبة تعمل بدون إنترنت</li>
      </ul>
      <button class="btn gold" data-a="closehow" style="margin-top:12px">فهمت ✓</button>
    </div></div>`;
  }
  if (result) {
    return `<div class="overlay">${confetti()}<div class="modal">
      <span class="emoji">🎉</span><h2>إجابة صحيحة!</h2>
      <div class="ans">${result.answer}</div>
      <div class="reward" dir="ltr">+${REWARD} 🪙</div>
      <button class="btn gold" data-a="next">${S.queue.length ? 'الجولة التالية ◀' : 'عرض النتيجة 🏆'}</button>
    </div></div>`;
  }
  return '';
}

function render() {
  const app = document.getElementById('app');
  if (screen === 'game' && S.queue.length === 0) screen = 'end';
  app.innerHTML = screen === 'menu' ? renderMenu() : screen === 'game' ? renderGame() : renderEnd();
  document.getElementById('layer').innerHTML = renderLayer();
  const inp = document.getElementById('ans');
  if (inp) inp.addEventListener('input', () => { draft = inp.value; });
}

// ============ 6) الأفعال ============
function buy(cost) { S.coins -= cost; sndBuy(); }
function flashCoins() {
  const c = document.getElementById('coins'); if (!c) return;
  c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
}
function say(msg) { const m = document.getElementById('msg'); if (m) m.textContent = msg; }

const actions = {
  play() {
    sndTap();
    S.started = true; save(); draft = ''; result = null;
    screen = S.queue.length ? 'game' : 'end'; render();
  },
  menu() { sndTap(); screen = 'menu'; result = null; render(); },
  howto() { sndTap(); showHowto = true; render(); },
  closehow() { sndTap(); showHowto = false; render(); },
  sound() { S.sound = !S.sound; save(); sndTap(); render(); },
  newgame() {
    if (!S.started || confirm('سيتم حذف تقدمك والبدء من جديد. هل أنت متأكد؟')) {
      S = newState(S.sound); save(); draft = ''; render();
    }
  },
  restart() { S = newState(S.sound); S.started = true; save(); draft = ''; screen = 'game'; render(); },
  check() {
    const qi = S.queue[0], q = QUESTIONS[qi];
    const inp = document.getElementById('ans'); if (inp) draft = inp.value;
    if (!draft.trim()) { say('اكتب إجابتك أولًا ✍️'); return; }
    if (isCorrect(q, draft)) {
      S.coins += REWARD; S.stats.correct++; S.queue.shift();
      result = { answer: q.a }; draft = ''; sndOk(); save(); render(); flashCoins();
    } else {
      sndBad(); say('إجابة خاطئة، حاول مرة أخرى ❌');
      const row = document.getElementById('ansrow');
      if (row) { row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake'); }
    }
    return 'keep';
  },
  next() { sndTap(); result = null; draft = ''; if (!S.queue.length) screen = 'end'; render(); },
  letter() {
    const qi = S.queue[0], q = QUESTIONS[qi], rev = S.revealed[qi] || [];
    const n = letterCount(q);
    if (rev.length >= n - 1) return say('لا يمكن كشف المزيد من الحروف 🙂');
    if (S.coins < COST_LETTER) return say('رصيدك لا يكفي 🪙');
    const free = []; for (let i = 0; i < n; i++) if (!rev.includes(i)) free.push(i);
    rev.push(free[Math.floor(Math.random() * free.length)]);
    S.revealed[qi] = rev; S.stats.letters++; buy(COST_LETTER); save(); render();
  },
  hint() {
    const qi = S.queue[0];
    if (S.hints[qi]) return say('التلميح ظاهر بالفعل 💡');
    if (S.coins < COST_HINT) return say('رصيدك لا يكفي 🪙');
    S.hints[qi] = true; S.stats.hints++; buy(COST_HINT); save(); render();
  },
  skip() {
    if (S.queue.length < 2) return say('هذا آخر سؤال، لا يمكن تخطيه');
    sndTap(); S.queue.push(S.queue.shift()); draft = ''; save(); render();
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.classList.contains('off') && !['letter', 'hint', 'skip'].includes(el.dataset.a)) return;
  const fn = actions[el.dataset.a];
  if (fn) fn();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target && e.target.id === 'ans') { e.preventDefault(); actions.check(); }
});

// ============ 7) الخلفية المتحركة ============
(function bg() {
  const b = document.getElementById('bg');
  let h = '<div class="blob" style="width:260px;height:260px;background:#ff4081;top:-60px;right:-80px"></div>' +
          '<div class="blob" style="width:300px;height:300px;background:#00bcd4;bottom:-100px;left:-100px"></div>';
  for (let i = 0; i < 45; i++) h += `<div class="star" style="left:${Math.random() * 100}%;top:${Math.random() * 100}%;animation-delay:${Math.random() * 3}s"></div>`;
  b.innerHTML = h;
})();

render();

// ============ 8) العمل بدون إنترنت ============
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
